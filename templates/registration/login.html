{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 月度成本结算平台</title>
  <link rel="stylesheet" href="{% static 'settlement/app.css' %}">
</head>
<body class="login-page">
  <section class="login-card">
    <div class="login-heading">
      <span class="brand-mark large">结</span>
      <div>
        <h1>月度成本结算平台</h1>
        <p>采购、库存、订单和销售成本一次结清</p>
      </div>
    </div>
    {% if form.errors %}
      <div class="message message-error">用户名或密码不正确。</div>
    {% endif %}
    <form method="post" class="stack-form">
      {% csrf_token %}
      <label>用户名{{ form.username }}</label>
      <label>密码{{ form.password }}</label>
      <button class="button primary wide" type="submit">登录</button>
    </form>
  </section>
</body>
</html>
